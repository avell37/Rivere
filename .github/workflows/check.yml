name: Check

on:
    workflow_call:

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install backend deps
              working-directory: ./backend
              run: npm ci

            - name: Generate Prisma client
              working-directory: ./backend
              env:
                  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
              run: npx prisma generate

            - name: Lint backend
              working-directory: ./backend
              run: npm run lint

            - name: Test backend
              working-directory: ./backend
              run: npm test

            - name: Build backend
              working-directory: ./backend
              run: npm run build

            - name: Install frontend deps
              working-directory: ./frontend
              run: npm ci

            - name: Lint frontend
              working-directory: ./frontend
              run: npm run lint

            - name: Test frontend
              working-directory: ./frontend
              run: npm test

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build
