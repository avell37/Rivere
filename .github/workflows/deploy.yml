name: Deploy

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-main
    cancel-in-progress: false

jobs:
    check:
        uses: ./.github/workflows/check.yml

    deploy:
        runs-on: ubuntu-latest
        needs: check

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      set -e
                      cd /var/www/Rivere
                      git reset --hard
                      git pull origin main
                      export SENTRY_RELEASE="$(git rev-parse --short HEAD)"
                      docker compose down
                      docker compose up -d --build

            - name: Smoke check — health
              run: |
                  for attempt in $(seq 1 12); do
                      if curl -fsS https://rivere.ru/api/health; then
                          echo "Health OK"
                          exit 0
                      fi
                      echo "Attempt ${attempt}/12 failed, retrying in 10s..."
                      sleep 10
                  done
                  echo "Health check failed after deploy"
                  exit 1

            - name: Smoke check — readiness
              run: curl -fsS https://rivere.ru/api/ready
