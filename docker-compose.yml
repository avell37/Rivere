services:
    migrate:
        build: ./backend
        env_file:
            - ./backend/.env.production
        command: npx prisma migrate deploy --config prisma.config.ts
        depends_on:
            - db

    backend:
        build: ./backend
        read_only: true
        expose:
            - "5000"
        env_file:
            - ./backend/.env.production
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_started
            migrate:
                condition: service_completed_successfully

    frontend:
        build:
            context: ./frontend
            args:
                NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
                NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://rivere.ru/api}
                NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL:-https://cdn.rivere.ru}
                NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        read_only: true
        expose:
            - "3000"
        depends_on:
            - backend
        env_file:
            - ./frontend/.env.production

    db:
        image: postgres:15-alpine
        env_file:
            - ./backend/.env.production
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:8-alpine
        command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
        env_file:
            - ./backend/.env.production

    nginx:
        image: nginx:alpine
        container_name: rivere_nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt
        depends_on:
            - frontend
            - backend

volumes:
    postgres_data:
