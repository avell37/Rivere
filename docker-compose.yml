services:
    migrate:
        build: ./backend
        restart: "no"
        env_file:
            - ./backend/.env.production
        command: npx prisma migrate deploy --config prisma.config.ts
        depends_on:
            - db

    backend:
        build: ./backend
        restart: always
        read_only: true
        expose:
            - "5000"
        env_file:
            - ./backend/.env.production
        environment:
            SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_started
            migrate:
                condition: service_completed_successfully

    frontend:
        build:
            context: ./frontend
            args:
                NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
                NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://rivere.ru/api}
                NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL:-https://cdn.rivere.ru/}
                NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
                NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
                SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
                SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        restart: always
        read_only: true
        expose:
            - "3000"
        depends_on:
            backend:
                condition: service_healthy
        env_file:
            - ./frontend/.env.production
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    db:
        image: postgres:15-alpine
        restart: always
        env_file:
            - ./backend/.env.production
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    redis:
        image: redis:8-alpine
        restart: always
        command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
        env_file:
            - ./backend/.env.production
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    nginx:
        image: nginx:alpine
        container_name: rivere_nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt
        depends_on:
            frontend:
                condition: service_healthy
            backend:
                condition: service_healthy

volumes:
    postgres_data:
